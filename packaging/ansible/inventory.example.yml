# Copy to inventory.yml. A host can be in several groups.
all:
  vars:
    ansible_user: admin            # a user with sudo on every server
  children:
    aetherion_main:
      hosts:
        main1:
          ansible_host: 10.0.0.10
          aetherion_main_users: [alice]
    aetherion_workers:
      hosts:
        # The inventory name is the worker's name: euWorker1@10.0.0.11.
        euWorker1:
          ansible_host: 10.0.0.11
        euWorker2:
          ansible_host: 10.0.0.12
        # Another name, or another address than the one Ansible connects to.
        us-east-gen-1.example.com:
          aetherion_worker_name: usWorker
          aetherion_worker_host: 10.1.0.11
    aetherion_agents:
      hosts:
        # The machines under test. The inventory name is the target: sutServer1@10.0.0.21.
        sutServer1:
          ansible_host: 10.0.0.21
        sutServer2:
          ansible_host: 10.0.0.22
