# try-restart: only a running worker, so --skip-tags service does not start one.
- name: Restart the worker
  ansible.builtin.command:
    argv: [systemctl, try-restart, aetherion-worker]
  changed_when: true

- name: Restart the agent
  ansible.builtin.command:
    argv: [systemctl, try-restart, aetherion-agent]
  changed_when: true
